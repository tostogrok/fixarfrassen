nt-size="16" font-weight="900" fill="#ffc93c">4</text><circle cx="684" cy="110" r="15" fill="#2a2622"/><text x="684" y="115" text-anchor="middle" font-size="16" font-weight="900" fill="#ffc93c">1</text><text x="708" y="108" font-size="15" font-weight="800" fill="#2a2622">Luften följer med vattnet uppåt</text><text x="708" y="127" font-size="15" fill="#2a2622">och fastnar högst upp i elementen.</text><circle cx="684" cy="200" r="15" fill="#2a2622"/><text x="684" y="205" text-anchor="middle" font-size="16" font-weight="900" fill="#ffc93c">2</text><text x="708" y="198" font-size="15" font-weight="800" fill="#2a2622">Släpp ut luften med nyckeln</text><text x="708" y="217" font-size="15" fill="#2a2622">tills det kommer vatten.</text><circle cx="684" cy="290" r="15" fill="#2a2622"/><text x="684" y="295" text-anchor="middle" font-size="16" font-weight="900" fill="#ffc93c">3</text><text x="708" y="288" font-size="15" font-weight="800" fill="#2a2622">Trycket sjunker när du luftar.</text><text x="708" y="307" font-size="15" fill="#2a2622">Fastighetsskötaren fyller på här.</text><circle cx="684" cy="380" r="15" fill="#2a2622"/><text x="684" y="385" text-anchor="middle" font-size="16" font-weight="900" fill="#ffc93c">4</text><text x="708" y="378" font-size="15" font-weight="800" fill="#2a2622">Pumpen trycker runt vattnet</text><text x="708" y="397" font-size="15" fill="#2a2622">genom alla våningar.</text><path d="M684 470 h26" stroke="#e8604c" stroke-width="8"/><text x="718" y="475" font-size="14" fill="#2a2622">Varmt vatten upp</text><path d="M684 500 h26" stroke="#4a90d9" stroke-width="8"/><text x="718" y="505" font-size="14" fill="#2a2622">Svalare vatten tillbaka</text></svg>