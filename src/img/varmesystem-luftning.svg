ikrum</text><path d="M206 690 V146" stroke="#4a90d9" stroke-width="10" stroke-linecap="round"/><path d="M180 640 V110" stroke="#e8604c" stroke-width="10" stroke-linecap="round"/><path d="M180 110 H250" stroke="#e8604c" stroke-width="8"/><path d="M250 144 H206" stroke="#4a90d9" stroke-width="8"/><rect x="250" y="94" width="170" height="58" rx="6" fill="#f6a15b"/><rect x="250" y="94" width="170" height="24" rx="6" fill="#e8eef3"/><circle cx="280" cy="106" r="6" fill="#fff" stroke="#9aa6b0" stroke-width="2"/><circle cx="310" cy="104" r="4" fill="#fff" stroke="#9aa6b0" stroke-width="2"/><circle cx="345" cy="107" r="7" fill="#fff" stroke="#9aa6b0" stroke-width="2"/><circle cx="380" cy="103" r="4" fill="#fff" stroke="#9aa6b0" stroke-width="2"/><circle cx="400" cy="108" r="5" fill="#fff" stroke="#9aa6b0" stroke-width="2"/><text x="335" y="142" text-anchor="middle" font-size="14" font-weight="800" fill="#2a2622">Kallt upptill</text><rect x="418" y="96" width="14" height="10" rx="2" fill="#9aa6b0" stroke="#2a2622" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M434 101 l18 -12" stroke="#2a2622" stroke-width="4" stroke-linecap="round"/><circle cx="454" cy="87" r="6" fill="#ffc93c" stroke="#2a2622" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M430 110 q4 10 0 18" fill="none" stroke="#4a90d9" stroke-width="3" stroke-linecap="round"/><rect x="250" y="94" width="170" height="58" rx="6" fill="none" stroke="#2a2622" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M272 98 V148" stroke="#2a2622" stroke-width="1.5" opacity=".35"/><path d="M294 98 V148" stroke="#2a2622" stroke-width="1.5" opacity=".35"/><path d="M316 98 V148" stroke="#2a2622" stroke-width="1.5" opacity=".35"/><path d="M338 98 V148" stroke="#2a2622" stroke-width="1.5" opacity=".35"/><path d="M360 98 V148" stroke="#2a2622" stroke-width="1.5" opacity=".35"/><path d="M382 98 V148" stroke="#2a2622" stroke-width="1.5" opacity=".35"/><path d="M4